apiVersion: apps/v1
kind: Deployment
metadata: {name: retailpulse}
spec:
  replicas: 2
  selector: {matchLabels: {app: retailpulse}}
  template:
    metadata: {labels: {app: retailpulse}}
    spec:
      containers:
      - name: app
        image: retailpulse:latest
        ports: [{containerPort: 8501}]
---
apiVersion: v1
kind: Service
metadata: {name: retailpulse}
spec:
  type: LoadBalancer
  selector: {app: retailpulse}
  ports: [{port: 80, targetPort: 8501}]
